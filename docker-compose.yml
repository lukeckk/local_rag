services:

  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    container_name: sg_crawler
    shm_size: "1gb"
    environment:
      - OUTPUT_DIR=/data/raw_markdown
    volumes:
      - ./data/raw_markdown:/data/raw_markdown
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sg_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sg_backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_HOST=host.docker.internal
      - OLLAMA_PORT=11434
      - OLLAMA_MODEL=llama3.2:3b
      - EMBED_MODEL=nomic-embed-text
    depends_on:
      - qdrant
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sg_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    restart: unless-stopped

volumes:
  qdrant_storage:
